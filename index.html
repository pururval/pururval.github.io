
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Portfolio of Pururva Lakkad, cloud engineer.">
    <link rel="icon" href="icons/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts: DM Sans and Space Grotesk by Google Fonts, licensed under the SIL Open Font License. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <title>Pururva Lakkad | Cloud Engineer</title>
    <style>
        :root {
            --ink: #17212b;
            --muted: #5e6c76;
            --paper: #f4f0e8;
            --accent: #d35d3f;
            --line: rgba(23, 33, 43, 0.16);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--paper);
            font-family: "DM Sans", sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.25;
            background-image: radial-gradient(rgba(23, 33, 43, 0.2) 0.7px, transparent 0.7px);
            background-size: 7px 7px;
        }

        main {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.6fr);
            gap: clamp(2rem, 8vw, 8rem);
            align-items: end;
            max-width: 1120px;
            min-height: 100vh;
            margin: auto;
            padding: clamp(2rem, 7vw, 6rem);
        }

        .eyebrow {
            margin: 0 0 1.5rem;
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 700px;
            margin: 0;
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(3.5rem, 10vw, 8.5rem);
            line-height: 0.88;
            letter-spacing: -0.06em;
        }

        .intro {
            max-width: 560px;
            margin: 2rem 0 0;
            color: var(--muted);
            font-size: clamp(1.05rem, 2vw, 1.35rem);
            line-height: 1.6;
        }

        .details {
            border-top: 1px solid var(--line);
            padding-top: 1.25rem;
        }

        .details p {
            margin: 0 0 1.25rem;
            color: var(--muted);
            line-height: 1.6;
        }

        .details strong { color: var(--ink); }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 0.65rem;
        }

        nav a {
            padding: 0.7rem 0.9rem;
            border: 1px solid var(--ink);
            color: var(--ink);
            font-size: 0.9rem;
            text-decoration: none;
            transition: background 160ms ease, color 160ms ease;
        }

        nav a:hover,
        nav a:focus-visible {
            background: var(--ink);
            color: var(--paper);
        }

        .legacy-nav {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1;
            display: flex;
            gap: 0.35rem;
        }

        .legacy-nav a {
            padding: 0.35rem 0.5rem;
            border: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.72rem;
        }

        .legacy-nav a:hover,
        .legacy-nav a:focus-visible {
            border-color: var(--ink);
        }

        @media (max-width: 700px) {
            main {
                grid-template-columns: 1fr;
                align-content: center;
                gap: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="legacy-nav" aria-label="Previous site versions">
        <a href="archive/legacy-pages/0/index.html">v0</a>
        <a href="archive/legacy-pages/1/index.html">v1</a>
        <a href="archive/legacy-pages/2/index.html">v2</a>
        <a href="archive/legacy-pages/3/index.html">v3</a>
    </nav>
    <main>
        <section aria-labelledby="page-title">
            <p class="eyebrow">Engineer</p>
            <h1 id="page-title">Pururva<br>Lakkad</h1>
            <p class="intro">I build things to solve problems.</p>
        </section>
        <aside class="details">
            <p><strong>Currently</strong><br>Data Engineer at Deutsche Bank</p>
            <nav aria-label="Professional links">
                <a href="https://github.com/pururval/" target="_blank" rel="noopener">GitHub</a>
                <a href="https://www.linkedin.com/in/pururvalakkad/" target="_blank" rel="noopener">LinkedIn</a>
                <a href="mailto:pururvalakkad@gmail.com">Email</a>
            </nav>
        </aside>
    </main>
</body>
</html>
